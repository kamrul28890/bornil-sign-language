# configs/pretrain_mkm.yaml
trial:
  name: data_full_pretrain_mkm
  seed: 42
  out_dir: data_full
data:
  manifest: video_data.csv
  tokenizer: bsl_sp.model
  max_frames: 512
  normalize: true
  upper_body: true
split:
  kind: random-v1
  fracs: [0.8, 0.1, 0.1]
model:
  arch: transformer
  d_model: 256
  nhead: 8
  num_encoder_layers: 4
  num_decoder_layers: 4
  dim_feedforward: 1024
  dropout: 0.1
  temporal_conv_layers: 2
  temporal_conv_kernel: 5
  ctc_head: false
pretrain:
  mask_ratio: 0.6
  min_span: 3
  max_span: 15
  epochs: 100
  batch_size: 32
  lr: 0.0005
  weight_decay: 0.0001
  clip_grad: 1.0
  device: auto
