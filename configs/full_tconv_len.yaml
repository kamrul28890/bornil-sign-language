# Full-dataset TConv + early-EOS penalty ablation.
#
# Goal: test whether discouraging premature EOS improves long-reference behavior
# after the temporal-convolution frontend improved BLEU-4 but not ROUGE-L.

trial:
  name: data_full_tconv_len
  seed: 42
  out_dir: data_full

data:
  manifest: video_data.csv
  tokenizer: bsl_sp.model
  max_frames: 512
  normalize: true
  upper_body: true

split:
  kind: random-v1
  fracs: [0.8, 0.1, 0.1]

model:
  d_model: 256
  nhead: 8
  num_encoder_layers: 4
  num_decoder_layers: 4
  dim_feedforward: 1024
  dropout: 0.1
  temporal_conv_layers: 2
  temporal_conv_kernel: 5

train:
  epochs: 60
  batch_size: 32
  lr: 0.0005
  weight_decay: 0.0001
  clip_grad: 1.0
  warmup_steps: 0
  label_smoothing: 0.1
  early_eos_penalty: 0.2
  beam_size: 1
  max_decode_len: 256
  device: auto
